<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title}+' | eShop'">eShop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
<div class="container flex-wrap gap-2">
<a class="navbar-brand fw-bold" th:href="@{/}">🛒 eShop</a>
<a class="nav-link text-white" th:href="@{/products}">Sản phẩm</a>
<div sec:authorize="hasRole('SELLER')" class="d-flex flex-wrap gap-3">
<a class="text-white" th:href="@{/admin/categories}">Danh mục</a>
<a class="text-white" th:href="@{/admin/products}">Quản lý sản phẩm</a>
<a class="text-white" th:href="@{/admin/orders}">Đơn hàng</a>
<a class="text-white" th:href="@{/admin/users}">Tài khoản</a>
</div>
<div sec:authorize="hasRole('CUSTOMER')" class="d-flex gap-3">
<a class="text-white" th:href="@{/cart}">Giỏ hàng <span class="badge bg-warning text-dark" th:text="${cartCount}">0</span>
</a>
<a class="text-white" th:href="@{/orders}">Đơn của tôi</a>
</div>
<div class="ms-auto d-flex gap-2 align-items-center">
<th:block sec:authorize="isAnonymous()">
<a class="btn btn-light btn-sm" th:href="@{/login}">Đăng nhập</a>
<a class="btn btn-outline-light btn-sm" th:href="@{/register}">Đăng ký</a>
</th:block>
<th:block sec:authorize="isAuthenticated()">
<span class="text-white" sec:authentication="name">
</span>
<form th:action="@{/logout}" method="post">
<button class="btn btn-outline-light btn-sm">Đăng xuất</button>
</form>
</th:block>
</div>
</div>
</nav>
<div th:fragment="alerts">
<div th:if="${message}" class="alert alert-success" th:text="${message}">
</div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}">
</div>
</div>
<footer th:fragment="footer" class="border-top mt-5 py-3 text-center text-muted small">eShop · HuynhHoaiThanh_23633801 · Spring Boot / Thymeleaf / MariaDB<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</footer>
</body>
</html>
