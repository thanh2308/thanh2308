<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Cửa hàng')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}">
</nav>
<main class="container">
<div th:replace="~{fragments/layout :: alerts}">
</div>
<h1 class="mb-4">Khám phá sản phẩm</h1>
<form th:action="@{/products}" method="get" class="row g-2 mb-4">
<div class="col-md-6">
<input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm tên sản phẩm">
</div>
<div class="col-md-4">
<select class="form-select" name="categoryId">
<option value="">Tất cả danh mục</option>
<option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId != null and categoryId == c.id}">
</option>
</select>
</div>
<div class="col-md-2">
<button class="btn btn-primary w-100">Tìm kiếm</button>
</div>
</form>
<p th:if="${page.empty}" class="alert alert-info">Không có sản phẩm phù hợp.</p>
<div class="row g-4">
<div class="col-sm-6 col-lg-3" th:each="p:${page.content}">
<article class="card h-100">
<img class="card-img-top product-img p-3" th:src="${p.imageUrl}" th:alt="${p.name}">
<div class="card-body d-flex flex-column">
<small class="text-muted" th:text="${p.category.name}">
</small>
<h2 class="h6 card-title" th:text="${p.name}">
</h2>
<p class="price" th:text="${#numbers.formatDecimal(p.price,0,'POINT',0,'COMMA')}+' ₫'">
</p>
<p th:text="|Tồn kho: ${p.quantity}|">
</p>
<div class="mt-auto">
<a class="btn btn-sm btn-outline-primary" th:href="@{/products/{id}(id=${p.id})}">Chi tiết</a>
<form sec:authorize="!hasRole('SELLER')" th:action="@{/cart/add}" method="post" class="d-inline">
<input type="hidden" name="productId" th:value="${p.id}">
<button class="btn btn-sm btn-primary" th:disabled="${p.quantity == 0}">Thêm vào giỏ</button>
</form>
</div>
</div>
</article>
</div>
</div>
<nav class="d-flex gap-3 mt-4" th:if="${page.totalPages > 1}">
<a th:if="${page.hasPrevious()}" th:href="@{/products(page=${page.number - 1},keyword=${keyword},categoryId=${categoryId})}">← Trước</a>
<span th:text="|Trang ${page.number + 1}/${page.totalPages}|">
</span>
<a th:if="${page.hasNext()}" th:href="@{/products(page=${page.number + 1},keyword=${keyword},categoryId=${categoryId})}">Sau →</a>
</nav>
</main>
<footer th:replace="~{fragments/layout :: footer}">
</footer>
</body>
</html>
