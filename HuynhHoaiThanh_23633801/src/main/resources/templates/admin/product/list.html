<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Sản phẩm')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}">
</nav>
<main class="container">
<div th:replace="~{fragments/layout :: alerts}">
</div>
<div class="d-flex justify-content-between mb-3">
<h1>Sản phẩm</h1>
<a class="btn btn-success align-self-center" th:href="@{/admin/products/new}">+ Thêm mới</a>
</div>
<form th:action="@{/admin/products}" method="get" class="row g-2 mb-4">
<div class="col-md-6">
<input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm tên sản phẩm">
</div>
<div class="col-md-4">
<select class="form-select" name="categoryId">
<option value="">Tất cả danh mục</option>
<option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${categoryId != null and categoryId == c.id}">
</option>
</select>
</div>
<div class="col-md-2">
<button class="btn btn-primary w-100">Tìm kiếm</button>
</div>
</form>
<div class="table-responsive">
<table class="table align-middle">
<thead>
<tr>
<th>ID</th>
<th>Tên</th>
<th>Giá</th>
<th>Tồn kho</th>
<th>Danh mục</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="x:${page.content}">
<td th:text="${x.id}">
</td>
<td th:text="${x.name}">
</td>
<td th:text="${x.price}">
</td>
<td th:text="${x.quantity}">
</td>
<td th:text="${x.category.name}">
</td>
<td>
<a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/{id}/edit(id=${x.id})}">Sửa</a>
<form class="d-inline" th:action="@{/admin/products/{id}/delete(id=${x.id})}" method="post" onsubmit="return confirm('Xóa dữ liệu này?')">
<button class="btn btn-sm btn-outline-danger">Xóa</button>
</form>
</td>
</tr>
</tbody>
</table>
</div>
<nav class="d-flex gap-3 mt-4" th:if="${page.totalPages > 1}">
<a th:if="${page.hasPrevious()}" th:href="@{/admin/products(page=${page.number - 1},keyword=${keyword},categoryId=${categoryId})}">← Trước</a>
<span th:text="|Trang ${page.number + 1}/${page.totalPages}|">
</span>
<a th:if="${page.hasNext()}" th:href="@{/admin/products(page=${page.number + 1},keyword=${keyword},categoryId=${categoryId})}">Sau →</a>
</nav>
</main>
<footer th:replace="~{fragments/layout :: footer}">
</footer>
</body>
</html>
