<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Tài khoản')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}">
</nav>
<main class="container">
<div th:replace="~{fragments/layout :: alerts}">
</div>
<div class="d-flex justify-content-between mb-3">
<h1>Tài khoản</h1>
<a class="btn btn-success align-self-center" th:href="@{/admin/users/new}">+ Thêm tài khoản</a>
</div>
<div class="table-responsive">
<table class="table">
<thead>
<tr>
<th>ID</th>
<th>Username</th>
<th>Họ tên</th>
<th>Email</th>
<th>Vai trò</th>
<th>Trạng thái</th>
<th>
</th>
</tr>
</thead>
<tbody>
<tr th:each="u:${users}">
<td th:text="${u.id}">
</td>
<td th:text="${u.username}">
</td>
<td th:text="${u.fullName}">
</td>
<td th:text="${u.email}">
</td>
<td th:text="${u.role}">
</td>
<td th:text="${u.enabled ? 'Hoạt động' : 'Bị khóa'}">
</td>
<td>
<a th:href="@{/admin/users/{id}/edit(id=${u.id})}">Sửa</a>
<form class="d-inline" th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" onsubmit="return confirm('Xóa tài khoản?')">
<button class="btn btn-sm btn-outline-danger">Xóa</button>
</form>
</td>
</tr>
</tbody>
</table>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}">
</footer>
</body>
</html>
